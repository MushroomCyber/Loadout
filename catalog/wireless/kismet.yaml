id: kismet
summary: Wireless network detector, sniffer and IDS
description: Kismet is a wireless network and device detector, sniffer, wardriving tool, and WIDS (wireless
  intrusion detection) framework. Kismet works with Wi-Fi interfaces, Bluetooth interfaces, some SDR (software
  defined radio) hardware like the RTLSDR, and other specialized capture hardware. This is a metapackage
  containing the kismet tools.
categories:
- wireless
- monitoring
tags:
- wifi
- ids
phases:
- discovery
- collection
binaries:
- kismet
homepage: https://www.kismetwireless.net
size: 23552
install:
- provider: apt
  package: kismet
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 2025.09.R1-0kali3
