id: suricata
summary: High-performance IDS, IPS and network security monitor
description: Suricata is a network Intrusion Detection System (IDS). It is based on rules (and is fully
  compatible with snort rules) to detect a variety of attacks / probes by searching packet content. It
  can also be used as Intrusion Prevention System (IPS), and as higher layer firewall. This new Engine
  supports Multi-Threading, Automatic Protocol Detection (IP, TCP, UDP, ICMP, HTTP, TLS, FTP and SMB),
  Gzip Decompression, Fast IP Matching and coming soon hardware acceleration on CUDA and OpenCL GPU cards.
  This version has inline (NFQUEUE) support enabled.
