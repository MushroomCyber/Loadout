id: sslstrip
summary: SSL/TLS man-in-the-middle attack tool
description: sslstrip is a tool that transparently hijacks HTTP traffic on a network, watch for HTTPS
  links and redirects, and then map those links into look-alike HTTP links or homograph-similar HTTPS
  links. It also supports modes for supplying a favicon which looks like a lock icon, selective logging,
  and session denial.
