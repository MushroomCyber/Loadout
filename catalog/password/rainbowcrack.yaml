id: rainbowcrack
summary: Rainbow table password cracker
description: RainbowCrack is a general propose implementation of Philippe Oechslin's faster time-memory
  trade-off technique. It crack hashes with rainbow tables. RainbowCrack uses time-memory tradeoff algorithm
  to crack hashes. It differs from the hash crackers that use brute force algorithm.
