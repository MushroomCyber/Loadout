id: cewl
summary: Custom wordlist generator that spiders a target site
description: CeWL (Custom Word List generator) is a ruby app which spiders a given URL, up to a specified
  depth, and returns a list of words which can then be used for password crackers such as John the Ripper.
  Optionally, CeWL can follow  external links. CeWL can also create a list of email addresses found in
  mailto links. These email addresses can be used as usernames in brute force actions. Another tool provided
  by CeWL project is FAB (Files Already Bagged). FAB extracts the content of the author/creator fields,
  from metadata of the some files, to create lists of possible usernames. These usernames can be used
  in association with the password list generated by CeWL. FAB uses the same metadata extraction techniques
  that CeWL. Currently, FAB process Office pre 2007, Office 2007 and PDF formats. CeWL is useful in security
  tests and forensics investigations. CeWL is pronounced "cool".
