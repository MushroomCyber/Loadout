id: hashid
summary: Hash type identifier
description: Identify the different types of hashes used to encrypt data and especially passwords. hashID
  is a tool written in Python 3.x which supports the identification of over 175 unique hash types using
  regular expressions. It is able to identify a single hash or parse a file and identify the hashes within
  it. There is also a nodejs version of hashID available which is easily set up to provide online hash
  identification.
categories:
- password
tags:
- identification
binaries:
- hashid
homepage: https://psypanda.github.io/hashID/
size: 84992
