id: cmospwd
summary: decrypt BIOS passwords from CMOS
description: CmosPwd is a cross-platform tool to decrypt password stored in CMOS used to access a computer's
  BIOS setup. This application should work out of the box on most modern systems, but some more esoteric
  BIOSes may not be supported or may require additional steps.
categories:
- password
