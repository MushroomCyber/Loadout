id: dex2jar
summary: Tools to work with android .dex and java .class files
description: 'dex2jar contains 4 compments: dex-reader is designed to read the Dalvik Executable (.dex/.odex)
  format. It has a light weight API similar with ASM. An example here dex-translator is designed to do
  the convert job. It reads the dex instruction to dex-ir format, after some optimize, convert to ASM
  format. dex-ir used by dex-translator, is designed to represent the dex instruction dex-tools tools
  to work with .class files.'
categories:
