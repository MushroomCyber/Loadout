id: gobuster
summary: Directory, DNS and vhost brute-forcer
description: 'Gobuster is a high-performance tool used to brute-force and discover: * URIs (directories
  and files) in web sites * DNS subdomains (with wildcard support) * Virtual Host names on target web
  servers * Open Amazon S3 and Google Cloud Storage (GCS) buckets * Open TFTP servers * Custom fuzzing
  with customizable parameters Gobuster is designed for penetration testers, security professionals, and
  forensics experts to perform security assessments and reconnaissance.'
categories:
- web
tags:
- fuzzing
phases:
- discovery
binaries:
- gobuster
homepage: https://github.com/OJ/gobuster
alternatives:
- ffuf
- feroxbuster
size: 9619456
install:
- provider: apt
  package: gobuster
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
- provider: brew
  formula: gobuster
- provider: go
  module: github.com/OJ/gobuster/v3@latest
version: 3.8.2-1
