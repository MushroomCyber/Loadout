id: commix
summary: Automated All-in-One OS Command Injection and Exploitation Tool
description: This package contains Commix (short for [comm]and [i]njection e[x]ploiter). It has a simple
  environment and it can be used, from web developers, penetration testers or even security researchers
  to test web applications with the view to find bugs, errors or vulnerabilities related to command injection
  attacks. By using this tool, it is very easy to find and exploit a command injection vulnerability in
  a certain vulnerable parameter or string. Commix is written in Python programming language.
categories:
- web
tags:
- injection
