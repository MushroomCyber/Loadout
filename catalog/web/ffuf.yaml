id: ffuf
summary: Fast web fuzzer for content and parameter discovery
description: ffuf is a fast web fuzzer written in Go that allows typical directory discovery, virtual
  host discovery (without DNS records) and GET and POST parameter fuzzing. This program is useful for
  pentesters, ethical hackers and forensics experts. It also can be used for security tests.
categories:
- web
- fuzzing
tags:
- fuzzing
- bug-bounty
phases:
- discovery
binaries:
- ffuf
homepage: https://github.com/ffuf/ffuf
license: Apache-2.0
verify: ffuf -V
alternatives:
- feroxbuster
- gobuster
- dirsearch
size: 9878528
install:
- provider: apt
  package: ffuf
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
- provider: brew
  formula: ffuf
- provider: go
  module: github.com/ffuf/ffuf/v2@latest
- provider: github
  repo: ffuf/ffuf
  checksums: '*checksums*.txt'
version: 2.1.0-1+b11
