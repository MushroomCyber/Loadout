id: secretfinder
summary: Find API keys and other secrets exposed in JavaScript source
description: 'Scans a page or a JS file for the regex patterns that catch API keys, tokens and other secrets
  accidentally left in client-side code -- a narrow, single-purpose complement to a broader secret scanner
  like trufflehog or gitleaks.


  No packaged install: the `SecretFinder` package on PyPI declares no console script, so `pipx` refuses
  it. Clone the repository and run `python3 SecretFinder.py`.'
categories:
- web
- recon
tags:
- secrets
- web
- javascript
phases:
- discovery
homepage: https://github.com/m4ll0k/SecretFinder
repo: m4ll0k/SecretFinder
license: GPL-3.0
alternatives:
- trufflehog
- gitleaks
install: []
