id: sqlmap
summary: Automated SQL injection detection and exploitation
description: sqlmap goal is to detect and take advantage of SQL injection vulnerabilities in web applications.
  Once it detects one or more SQL injections on the target host, the user can choose among a variety of
  options to perform an extensive back-end database management system fingerprint, retrieve DBMS session
  user and database, enumerate users, password hashes, privileges, databases, dump entire or user's specific
  DBMS tables/columns, run his own SQL statement, read specific files on the file system and more.
categories:
- web
- database
tags:
- sqli
- classic
phases:
- initial-access
- credential-access
binaries:
- sqlmap
homepage: https://sqlmap.org
