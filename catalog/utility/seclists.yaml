id: seclists
kind: content
summary: The collection of wordlists everything else expects
description: SecLists is a collection of multiple types of lists used during security assessments. List
  types include usernames, passwords, URLs, sensitive data grep strings, fuzzing payloads, and many more.
  The goal is to enable a security tester to pull this repo onto a new testing box and have access to
  every type of list that may be needed.
categories:
- utility
tags:
- wordlists
- data
phases:
- discovery
paths:
- /usr/share/seclists
homepage: https://github.com/danielmiessler/SecLists
size: 1935140864
install:
- provider: apt
  package: seclists
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
- provider: brew
  formula: seclists
