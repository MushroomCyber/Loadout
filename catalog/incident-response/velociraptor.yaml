id: velociraptor
summary: Endpoint visibility and digital forensics at scale
categories:
- incident-response
- detection
tags:
- edr
- dfir
- blue-team
phases:
- collection
- analysis
binaries:
- velociraptor
homepage: https://docs.velociraptor.app
alternatives:
- osquery
verify: velociraptor version
install:
- provider: github
  repo: Velocidex/velociraptor
  # No checksums*.txt in the release, confirmed against the live API --
  # velociraptor publishes none. What it does publish is a detached OpenPGP
  # signature beside every asset, so verification here is over the binary
  # itself rather than over a checksum listing that covers it.
  #
  # The pin below was established from the release rather than from a web
  # page: the issuer fingerprint was read out of the real
  # velociraptor-v0.77.2-linux-amd64.sig, the key was fetched from
  # keys.openpgp.org by that exact fingerprint -- a lookup that cannot
  # return a different key -- and the pair was confirmed to produce a
  # VALIDSIG over the real binary. The key is inlined so nothing is fetched
  # at install time.
  signature:
    type: gpg
    asset: "{asset}.sig"
    signs: artifact
    key_fingerprint: 0572F28B4EF19A043F4CBBE0B22A7FB19CB6CFA1
