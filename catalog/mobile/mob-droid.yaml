id: mob-droid
summary: Menu-driven wrapper around msfvenom for Android payloads
description: 'Walks through msfvenom''s Android payload options as a menu instead of flags, for anyone
  who wants the output without memorising the switches. Metasploit itself does the actual work -- this
  only saves typing.


  No packaged install: needs `metasploit-framework` already on PATH, which this catalog already installs.
  `git clone` and run `./Mob-Droid.sh`.'
categories:
