id: modelscan
summary: Scan model files for code that executes on load
description: 'A pickle is executable code, and most model formats are pickles. modelscan reads a saved
  model without loading it and reports the operators that would run -- the same job a file scanner does,
  on a file type nobody treats as executable.


  Upstream pins `requires_python >=3.10,<3.13`. Loadout builds the pipx venv with a matching interpreter
  when the machine has one, and refuses the install with that explanation when it does not — which is
  the case on a stock Kali, where 3.13 is the only Python present. Install python3.12 to use it, or use
  picklescan, which covers the same ground with no such pin.'
categories:
- ai-security
- malware
tags:
- ml
- supply-chain
- scanner
phases:
- discovery
binaries:
- modelscan
homepage: https://github.com/protectai/modelscan
repo: protectai/modelscan
license: Apache-2.0
verify: modelscan --version
alternatives:
- picklescan
- fickling
install:
- provider: pipx
  package: modelscan
  requires_python: '>=3.10,<3.13'
