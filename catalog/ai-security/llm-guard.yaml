id: llm-guard
summary: Input and output scanners for LLM applications
description: 'The blue-team side: a library of scanners that sit in front of and behind a model, catching
  prompt injection, secrets, PII and toxic output. Useful on an engagement for working out what the target''s
  defences actually catch.


  This is a library, not a command-line tool: it declares no console script, so `pipx` refuses it. Add
  it to a project instead — `pip install llm-guard` inside that project''s virtualenv.'
categories:
- ai-security
- detection
tags:
- llm
