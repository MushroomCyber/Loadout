id: vigil-llm
summary: Scanner for prompt injection and other LLM input risks (unmaintained)
description: 'Vigil scans prompts against YARA rules, a vector database of known injections, transformer
  classifiers and canary tokens, and ships as a Python library plus a REST API server.


  No longer maintained: Never published to PyPI and unchanged since January 2024. Protect AI archived
  llm-guard too, so this catalog no longer names a packaged replacement -- the maintained options in this
  space are NVIDIA''s NeMo-Guardrails and guardrails-ai, both libraries you add to a project with pip
  rather than tools you install.'
categories:
- ai-security
- detection
tags:
- llm
- blue-team
- prompt-injection
phases:
- discovery
homepage: https://github.com/deadbits/vigil-llm
repo: deadbits/vigil-llm
license: Apache-2.0
alternatives:
- rebuff
install: []
