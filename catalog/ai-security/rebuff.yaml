id: rebuff
summary: Prompt-injection detector for LLM applications (unmaintained)
description: 'Rebuff layered four prompt-injection defences — heuristics, a model-based check, a vector
  store of known attacks, and canary tokens — behind one API.


  No longer maintained: The repository was archived by its authors in August 2024. Protect AI archived
  llm-guard too, so this catalog no longer names a packaged replacement -- the maintained options in this
  space are NVIDIA''s NeMo-Guardrails and guardrails-ai, both libraries you add to a project with pip
  rather than tools you install.'
categories:
- ai-security
- detection
tags:
