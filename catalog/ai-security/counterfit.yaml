id: counterfit
summary: Command-line harness for attacking machine-learning models
description: 'Microsoft''s Counterfit wraps published ML attack frameworks behind one CLI, so a model
  can be assessed the way a service would be — pick a target, pick an attack, run it — rather than by
  writing a research notebook.


  Broken on Python 3.12 and newer: it depends on eventlet, which imports distutils, removed from the standard
  library in 3.12. `pipx install counterfit` succeeds and the binary then dies on import, so `loadout
  verify counterfit` reports it as failed — correctly. Install it under an older interpreter with `pipx
  install --python python3.11 counterfit`.


  Upstream publishes only pre-release versions to PyPI (0.1.4.dev9 is current) and the repository has
  been quiet since mid-2025.'
categories:
- ai-security
tags:
- ml
- adversarial
- microsoft
phases:
- discovery
binaries:
- counterfit
homepage: https://github.com/Azure/counterfit
repo: Azure/counterfit
license: MIT
verify: counterfit --help
alternatives:
- adversarial-robustness-toolbox
- textattack
install:
- provider: pipx
  package: counterfit
