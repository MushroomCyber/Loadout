id: autopsy
summary: Graphical front-end for disk forensics and timeline analysis
description: The Autopsy Forensic Browser is a graphical interface to the command line digital forensic
  analysis tools in The Sleuth Kit. Together, The Sleuth Kit and Autopsy provide many of the same features
  as commercial digital forensics tools for the analysis of Windows and UNIX file systems (NTFS, FAT,
  FFS, EXT2FS, and EXT3FS).
