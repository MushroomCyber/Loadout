id: extundelete
summary: utility to recover deleted files from ext3/ext4 partition
description: extundelete uses the information stored in the partition's journal to attempt to recover
  a file that has been deleted. There is no guarantee that any particular file will be able to be undeleted.
categories:
- forensics
tags:
- recovery
binaries:
- extundelete
homepage: http://extundelete.sourceforge.net/
size: 155648
install:
- provider: apt
  package: extundelete
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 0.2.4-3+b2
