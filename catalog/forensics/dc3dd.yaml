id: dc3dd
summary: patched version of GNU dd with forensic features
description: 'dc3dd is a patched version of GNU dd with added features for computer forensics: * on the
  fly hashing (md5, sha-1, sha-256, and sha-512); * possibility to write errors to a file; * group errors
  in the error log; * pattern wiping; * progress report; * possibility to split output.'
categories:
- forensics
tags:
- imaging
homepage: https://sourceforge.net/projects/dc3dd/
size: 489472
install:
- provider: apt
  package: dc3dd
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 7.3.1-4
