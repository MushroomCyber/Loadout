id: nuclei
summary: Template-driven vulnerability scanner for known issues
description: This package contains  a fast tool for configurable targeted scanning based on templates
  offering massive extensibility and ease of use. Nuclei is used to send requests across targets based
  on a template leading to zero false positives and providing fast scanning on large number of hosts.
  Nuclei offers scanning for a variety of protocols including TCP, DNS, HTTP, File, etc. With powerful
  and flexible templating, all kinds of security checks can be modelled with Nuclei.
categories:
- vuln-scan
- web
tags:
- projectdiscovery
- bug-bounty
- templates
phases:
- discovery
binaries:
- nuclei
homepage: https://github.com/projectdiscovery/nuclei
verify: nuclei -version
alternatives:
- nikto
- zaproxy
size: 125119488
install:
- provider: apt
  package: nuclei
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
- provider: brew
  formula: nuclei
- provider: go
  module: github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
- provider: github
  repo: projectdiscovery/nuclei
  checksums: '*checksums*.txt'
version: 3.8.0-0kali1
