id: masscan
summary: Internet-scale TCP port scanner
description: MASSCAN is TCP port scanner which transmits SYN packets asynchronously and produces results
  similar to nmap, the most famous port scanner. Internally, it operates more like scanrand, unicornscan,
  and ZMap, using asynchronous transmission. It's a flexible utility that allows arbitrary address and
  port ranges.
categories:
- recon
tags:
- port-scan
phases:
- discovery
binaries:
- masscan
homepage: https://github.com/robertdavidgraham/masscan
requires_root: true
verify: masscan --version
alternatives:
- nmap
- naabu
size: 528384
install:
- provider: apt
  package: masscan
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
- provider: brew
  formula: masscan
version: 2:1.3.2+ds1-2
