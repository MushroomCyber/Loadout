id: dnsx
summary: Fast DNS resolution and probing toolkit
description: This package contains a fast and multi-purpose DNS toolkit allow to run multiple probes using
  retryabledns library, that allows you to perform multiple DNS queries of your choice with a list of
  user supplied resolvers, additionally supports DNS wildcard filtering like shuffledns (https://github.com/projectdiscovery/shuffledns).
  Features * Simple and Handy utility to query DNS records * Supports A, AAAA, CNAME, PTR, NS, MX, TXT,
  SOA * Supports DNS Status Code probing * Supports DNS Tracing * Handles wildcard subdomains in automated
  way. * Stdin and stdout support to work with other tools.
categories:
- recon
tags:
- dns
- projectdiscovery
phases:
- reconnaissance
binaries:
- dnsx
homepage: https://github.com/projectdiscovery/dnsx
