id: amass
summary: In-depth attack surface mapping and subdomain enumeration
description: 'This package contains a tool to help information security professionals perform network
  mapping of attack surfaces and perform external asset discovery using open source information gathering
  and active reconnaissance techniques. Information Gathering Techniques Used: - DNS: Basic enumeration,
  Brute forcing (upon request), Reverse DNS sweeping, Subdomain name alterations/permutations, Zone transfers
  (upon request) - Scraping: Ask, Baidu, Bing, DNSDumpster, DNSTable, Dogpile, Exalead, Google, HackerOne,
  IPv4Info, Netcraft, PTRArchive, Riddler, SiteDossier, ViewDNS, Yahoo - Certificates: Active pulls (upon
  request), Censys, CertSpotter, Crtsh, Entrust, GoogleCT - APIs: AlienVault, BinaryEdge, BufferOver,
  CIRCL, CommonCrawl, DNSDB, HackerTarget, Mnemonic, NetworksDB, PassiveTotal, RADb, Robtex, SecurityTrails,
  ShadowServer, Shodan, Spyse (CertDB & FindSubdomains), Sublist3rAPI, TeamCymru, ThreatCrowd, Twitter,
  Umbrella, URLScan, VirusTotal - Web Archives: ArchiveIt, ArchiveToday, Arquivo,'
categories:
- recon
tags:
- subdomains
- osint
- owasp
phases:
- reconnaissance
binaries:
- amass
homepage: https://owasp.org/www-project-amass/
alternatives:
- subfinder
- assetfinder
size: 53002240
install:
- provider: apt
  package: amass
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
- provider: brew
  formula: amass
- provider: github
  repo: owasp-amass/amass
  checksums: '*checksums*.txt'
version: 5.1.1-0kali1
