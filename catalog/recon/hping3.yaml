id: hping3
summary: Active Network Smashing Tool
description: hping3 is a network tool able to send custom ICMP/UDP/TCP packets and to display target replies
  like ping does with ICMP replies. It handles fragmentation and arbitrary packet body and size, and can
  be used to transfer files under supported protocols. Using hping3, you can test firewall rules, perform
  (spoofed) port scanning, test network performance using different protocols, do path MTU discovery,
  perform traceroute-like actions under different protocols, fingerprint remote operating systems, audit
  TCP/IP stacks, etc.  hping3 is scriptable using the Tcl language.
categories:
- recon
binaries:
- hping3
homepage: http://www.hping.org/
size: 261120
install:
- provider: apt
  package: hping3
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
