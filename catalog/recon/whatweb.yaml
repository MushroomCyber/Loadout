id: whatweb
summary: Next generation web scanner
description: WhatWeb identifies websites. It recognises web technologies including content management
  systems (CMS), blogging platforms, statistic/analytics packages, JavaScript libraries, web servers,
  and embedded devices. WhatWeb has over 900 plugins, each to recognise something different. It also identifies
  version numbers, email addresses, account IDs, web framework modules, SQL errors, and more.
categories:
- recon
