id: dnsrecon
summary: Powerful DNS enumeration script
description: 'DNSRecon is a Python script that provides the ability to perform: * Check all NS Records
  for Zone Transfers. * Enumerate General DNS Records for a given Domain (MX, SOA, NS, A, AAAA, SPF and
  TXT). * Perform common SRV Record Enumeration. * Top Level Domain (TLD) Expansion. * Check for Wildcard
  Resolution. * Brute Force subdomain and host A and AAAA records given a domain and a wordlist. * Perform
  a PTR Record lookup for a given IP Range or CIDR. * Check a DNS Server Cached records for A, AAAA and
  CNAME * Records provided a list of host records in a text file to check. * Enumerate Hosts and Subdomains
  using Google'
categories:
- recon
tags:
- dns
binaries:
- dnsrecon
homepage: https://github.com/darkoperator/dnsrecon
size: 1522688
install:
- provider: apt
  package: dnsrecon
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 1.3.1-3
