id: net-tools
summary: NET-3 networking toolkit
description: This package includes the important tools for controlling the network subsystem of the Linux
  kernel.  This includes arp, ifconfig, netstat, rarp, nameif and route.  Additionally, this package contains
  utilities relating to particular network hardware types (plipconfig, slattach, mii-tool) and advanced
  aspects of IP configuration (iptunnel, ipmaddr). In the upstream package 'hostname' and friends are
  included. Those are not installed by this package, since there is a special "hostname*.deb".
categories:
- network
homepage: http://sourceforge.net/projects/net-tools/
size: 939008
install:
- provider: apt
  package: net-tools
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 2.10-2
