id: eaphammer
summary: toolkit for targeted evil twin attacks against WPA2-Enterprise networks
description: This package contains a toolkit for performing targeted evil twin attacks against WPA2-Enterprise
  networks. It is designed to be used in full scope wireless assessments and red team engagements. As
  such, focus is placed on providing an easy-to-use interface that can be leveraged to execute powerful
  wireless attacks with minimal manual configuration. To illustrate just how fast this tool is, the Quick
  Start section provides an example of how to execute a credential stealing evil twin attack against a
  WPA/2-EAP network in just commands.
