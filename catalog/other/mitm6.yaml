id: mitm6
summary: pwning IPv4 via IPv6
description: mitm6 is a pentesting tool that exploits the default configuration of Windows to take over
  the default DNS server. It does this by replying to DHCPv6 messages, providing victims with a link-local
  IPv6 address and setting the attackers host as default DNS server.
categories:
- other
binaries:
- mitm6
homepage: https://github.com/dirkjanm/mitm6
size: 40960
install:
- provider: apt
  package: mitm6
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 0.3.0-0kali1
