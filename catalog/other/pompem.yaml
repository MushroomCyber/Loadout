id: pompem
summary: Exploit and Vulnerability Finder
description: 'Find exploit with a system of advanced search, designed to automate the search for Exploits
  and Vulnerability in the most important databases facilitating the work of pentesters, ethical hackers
  and forensics expert. Performs searches in databases: PacketStorm security, CXSecurity, ZeroDay, Vulners,
  National Vulnerability Database, WPScan Vulnerability Database. This tool is essential in the security
  of networks and systems. The search results can be exported to HTML or text format.'
