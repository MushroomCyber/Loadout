id: wifiphisher
summary: Automated phishing attacks against Wi-Fi networks
description: This package contains a security tool that mounts automated phishing attacks against Wi-Fi
  networks in order to obtain secret passphrases or other credentials. It is a social engineering attack
  that unlike other methods it does not include any brute forcing. It is an easy way for obtaining credentials
  from captive portals and third party login pages or WPA/WPA2 secret passphrases.
