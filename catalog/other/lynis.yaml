id: lynis
summary: security auditing tool for Unix based systems
description: Lynis is an auditing tool for hardening GNU/Linux and Unix based systems. It scans the system
  configuration and creates an overview of system information and security issues usable by professional
  auditors. It can assist in automated audits. Lynis can be used in addition to other software, like security
  scanners, system benchmarking and fine-tuning tools.
categories:
- vuln-scan
homepage: https://cisofy.com/lynis/
size: 1763328
install:
- provider: apt
  package: lynis
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 3.1.6-1
