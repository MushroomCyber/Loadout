id: cabextract
summary: Microsoft Cabinet file unpacker
description: Cabextract is a program which unpacks cabinet (.cab) files, which are a form of archive Microsoft
  uses to distribute their software and things like Windows Font Packs.
categories:
- forensics
size: 84992
install:
