id: siege
summary: HTTP regression testing and benchmarking utility
description: 'Siege is an regression test and benchmark utility. It can stress test a single URL with
  a user defined number of simulated users, or it can read many URLs into memory and stress them simultaneously.
  The program reports the total number of hits recorded, bytes transferred, response time, concurrency,
  and return status. Siege supports HTTP/1.0 and 1.1 protocols, the GET and POST directives, cookies,
  transaction logging, and basic authentication. Its features are configurable on a per user basis. Note:
  this package contains siege with HTTPS support turned on, thus it obsoletes siege-ssl package now.'
categories:
- vuln-scan
binaries:
- siege
- bombardment
- siege.config
- siege2csv
homepage: https://www.joedog.org/JoeDog/Siege
size: 290816
