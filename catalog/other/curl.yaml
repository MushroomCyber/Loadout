id: curl
summary: command line tool for transferring data with URL syntax
description: curl is a command line tool for transferring data with URL syntax, supporting DICT, FILE,
  FTP, FTPS, GOPHER, HTTP, HTTPS, IMAP, IMAPS, LDAP, LDAPS, POP3, POP3S, RTMP, RTSP, SCP, SFTP, SMTP,
  SMTPS, TELNET and TFTP. curl supports SSL certificates, HTTP POST, HTTP PUT, FTP uploading, HTTP form
  based upload, proxies, cookies, user+password authentication (Basic, Digest, NTLM, Negotiate, kerberos...),
  file transfer resume, proxy tunneling and a busload of other useful tricks.
categories:
- recon
binaries:
- curl
- wcurl
homepage: https://curl.se/
size: 519168
install:
- provider: apt
  package: curl
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 8.20.0-5
