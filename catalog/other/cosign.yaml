id: cosign
summary: Code signing/transparency for containers and binaries (program)
description: 'Signing OCI containers (and other artifacts) using Sigstore Cosign supports: * "Keyless
  signing" with the Sigstore public good Fulcio certificate authority and Rekor transparency log (default)
  * Hardware and KMS signing * Signing with a cosign generated encrypted private/public keypair * Container
  Signing, Verification and Storage in an OCI registry. * Bring-your-own PKI This package contains the
  command-line tool cosign.'
categories:
- other
binaries:
- cosign
homepage: https://github.com/sigstore/cosign
verify: cosign version
size: 88803328
install:
- provider: github
  repo: sigstore/cosign
  asset: cosign-linux-amd64
  checksums: cosign_checksums.txt
  priority: 40
  # A Sigstore bundle: signature, certificate and transparency-log entry in
  # one file. Signed by the project's own service account, not by a GitHub
  # workflow -- that identity was read out of the real bundle, which is why
  # it is not the `github.com/sigstore/...` value the shape suggests.
  signature:
    type: cosign
    format: bundle
    asset: "{asset}.sigstore.json"
    signs: artifact
    certificate_identity: keyless@projectsigstore.iam.gserviceaccount.com
    certificate_oidc_issuer: https://accounts.google.com
- provider: apt
  package: cosign
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 3.0.6-1
