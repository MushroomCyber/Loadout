id: crack
summary: Password guessing program (crypt() variant)
description: Crack is program designed to quickly locate vulnerabilities in Unix (or other) password files
  by scanning the contents of a password file, looking for users who have misguidedly chosen a weak login
  password. This package provides the runtime files for the crypt() version.
