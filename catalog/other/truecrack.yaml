id: truecrack
summary: Bruteforce password cracker for TrueCrypt volumes
description: TrueCrack is a bruteforce password cracker for TrueCrypt (Copyright) volume. It is optimazed
  with Nvidia Cuda technology. It works with PBKDF2 (defined in PKCS5 v2.0) based on RIPEMD160 Key derivation
  function and XTS block cipher mode of operation used for hard disk encryption based on AES.
categories:
- password
