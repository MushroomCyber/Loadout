id: fiked
summary: Cisco VPN attack tool
description: FakeIKEd, or fiked for short, is a fake IKE daemon supporting just enough of the standards
  and Cisco extensions to attack commonly found insecure Cisco VPN PSK+XAUTH based IPsec authentication
  setups in what could be described as a semi MitM attack. Fiked can impersonate a VPN gateway’s IKE responder
  in order to capture XAUTH login credentials; it doesn’t currently do the client part of full MitM.
categories:
- sniffing
homepage: https://www.roe.ch/FakeIKEd
size: 177152
install:
- provider: apt
  package: fiked
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 0.0.5-1kali8+b1
