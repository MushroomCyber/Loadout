id: thc-ssl-dos
summary: Stress tester for the SSL handshake
description: THC-SSL-DOS is a tool to verify the performance of SSL. Establishing a secure SSL connection
  requires 15x more processing power on the server than on the client. THC-SSL-DOS exploits this asymmetric
  property by overloading the server and knocking it off the Internet. This problem affects all SSL implementations
  today. The vendors are aware of this problem since 2003 and the topic has been widely discussed. This
  attack further exploits the SSL secure Renegotiation feature to trigger thousands of renegotiations
  via single TCP connection.
categories:
- vuln-scan
homepage: http://www.thc.org/thc-ssl-dos/
size: 35840
install:
