id: oscanner
summary: Oracle assessment framework
description: 'Oscanner is an Oracle assessment framework developed in Java. It has a plugin-based architecture
  and comes with a couple of plugins that currently do: - Sid Enumeration - Passwords tests (common &
  dictionary) - Enumerate Oracle version - Enumerate account roles - Enumerate account privileges - Enumerate
  account hashes - Enumerate audit information - Enumerate password policies - Enumerate database links
  The results are given in a graphical java tree.'
categories:
- web
binaries:
- oscanner
homepage: http://www.cqure.net/wp/tools/database/oscanner/
size: 1537024
install:
- provider: apt
  package: oscanner
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 1.0.6-1kali4
