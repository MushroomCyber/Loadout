id: testdisk
summary: Partition scanner and disk recovery tool, and PhotoRec file recovery tool
description: 'TestDisk checks the partition and boot sectors of your disks. It is very useful in forensics,
  recovering lost partitions. It works with : * DOS/Windows FAT12, FAT16 and FAT32 * NTFS ( Windows NT/2K/XP
  ) * Linux Ext2 and Ext3 * BeFS ( BeOS ) * BSD disklabel ( FreeBSD/OpenBSD/NetBSD ) * CramFS (Compressed
  File System) * HFS and HFS+, Hierarchical File System * JFS, IBM''s Journaled File System * Linux Raid
  * Linux Swap (versions 1 and 2) * LVM and LVM2, Linux Logical Volume Manager * Netware NSS * ReiserFS
  3.5 and 3.6 * Sun Solaris i386 disklabel * UFS and UFS2 (Sun/BSD/...) * XFS, SGI''s Journaled File System
  PhotoRec is file data recovery software designed to recover lost pictures from digital camera memory
  or even Hard Disks. It has been extended to search also for non audio/video headers. It searches for
  following files and is able to undelete them: * Sun/NeXT audio data (.au) * RIFF audio/video (.avi/.wav)
  * BMP bitmap (.bmp) * bzip2 compressed data (.bz2) * Source code written in C ('
categories:
- vuln-scan
size: 1530880
binaries:
- testdisk
- fidentify
- photorec
install:
- provider: apt
  package: testdisk
  distros:
