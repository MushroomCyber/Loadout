id: scrounge-ntfs
summary: Data recovery program for NTFS filesystems
description: Scrounge NTFS is a data recovery program for NTFS filesystems. It reads each block of the
  hard disk and try to rebuild the original filesystem tree into a directory. This package is useful in
  forensics investigations.
categories:
- forensics
homepage: http://thewalter.net/stef/software/scrounge/
size: 50176
install:
- provider: apt
  package: scrounge-ntfs
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 0.9-11
