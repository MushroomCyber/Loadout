id: dumpzilla
summary: Mozilla browser forensic tool
description: Dumpzilla application is developed in Python 3.x and has as purpose extract all forensic
  interesting information of Firefox, Iceweasel and Seamonkey browsers to be analyzed. Due to its Python
  3.x development, might not work properly in old Python versions, mainly with certain characters. Works
  under Unix and Windows 32/64 bits systems. Works in command line interface, so information dumps could
  be redirected by pipes with tools such as grep, awk, cut, sed... Dumpzilla allows one to visualize following
  sections, search customization and extract certain content.
categories:
- forensics
binaries:
- dumpzilla
homepage: http://www.dumpzilla.org/
size: 139264
install:
- provider: apt
  package: dumpzilla
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 20210311-0kali4
