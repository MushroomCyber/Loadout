id: sakis3g
summary: Tool for establishing 3G connections
description: Sakis3G is a tweaked shell script which is supposed to work out-of-the-box for establishing
  a 3G connection with any combination of modem or operator. It automagically setups your USB or Bluetooth™
  modem, and may even detect operator settings. You should try it when anything else fails.
categories:
- wireless
binaries:
- sakis3g
homepage: http://www.sakis3g.org
size: 549888
install:
- provider: apt
  package: sakis3g
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 0.2.0e+git20150717-0kali2
