id: passdetective
summary: CLI tool that scans shell command history
description: This package contains a command-line tool that scans the shell command history for mistakenly
  written passwords, API keys, and secrets. It uses regular expressions to identify potential sensitive
  information and helps avoid accidentally exposing sensitive data in the command history.
