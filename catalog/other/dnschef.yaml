id: dnschef
summary: DNS proxy for penetration testers
description: DNSChef is a highly configurable DNS proxy for Penetration Testers and Malware Analysts.
  A DNS proxy (aka "Fake DNS") is a tool used for application network traffic analysis among other uses.
  For example, a DNS proxy can be used to fake requests for "badguy.com" to point to a local machine for
  termination or interception instead of a real host somewhere on the Internet.
categories:
- sniffing
binaries:
- dnschef
homepage: https://github.com/iphelix/dnschef
size: 52224
install:
- provider: apt
  package: dnschef
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 0.4+git20190327-0kali4
