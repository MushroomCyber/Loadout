id: bruteforce-wallet
summary: try to find the password of an encrypted wallet file
description: 'bruteforce-wallet try to find the password of an encrypted Peercoin (or Bitcoin, Litecoin,
  etc...) wallet file. It can be used in two ways: - Try all possible passwords given a charset. - Try
  all passwords in a file (dictionary). bruteforce-wallet have the following features: - You can specify
  the number of threads to use when cracking a file. - Sending a USR1 signal to a running bruteforce-wallet
  process makes it print progress and continue. - There are an exhaustive mode and a dictionary mode.
  In the exhaustive mode the program tries to decrypt one of the encrypted addresses in the wallet by
  trying all the possible passwords. It is especially useful if you know something about the password
  (i.e. you forgot a part of your password but still remember most of it). Finding the password of a wallet
  without knowing anything about it would take way too much time (unless the password is really short
  and/or weak). There are some command line options to specify: - The minimum password length t'
categories:
- other
binaries:
- bruteforce-wallet
homepage: https://github.com/glv2/bruteforce-wallet
size: 53248
