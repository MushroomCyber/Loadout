id: hekatomb
summary: Extract and decrypt all credentials from all domain computers
description: Hekatomb is a Python script that connects to an LDAP directory to retrieve all computers
  and users' information. From there, it will download all DPAPI blobs of all users from all computers
  and use Domain backup keys to decrypt them.
