id: patchleaks
summary: Go from a CVE number to the exact patched code and its vulnerability analysis
description: This package contains a tool to compare two versions of a code‑base, highlight lines changed
  by vendor, and explain why they matter. Feed the tool an old and a patched version; PatchLeaks spots
