id: gospider
summary: Fast web spider written in Go
description: 'This package contains a Fast web spider written in Go. The features are: - Fast web crawling
  - Brute force and parse sitemap.xml - Parse robots.txt - Generate and verify link from JavaScript files
  - Link Finder - Find AWS-S3 from response source - Find subdomains from response source - Get URLs from
  Wayback Machine, Common Crawl, Virus Total, Alien Vault - Format output easy to Grep - Support Burp
  input - Crawl multiple sites in parallel - Random mobile/web User-AgentShowcases'
categories:
- other
binaries:
- gospider
homepage: https://github.com/jaeles-project/gospider
size: 11729920
install:
- provider: apt
  package: gospider
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 1.1.0-0kali1
