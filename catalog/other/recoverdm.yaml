id: recoverdm
summary: recover files on disks with damaged sectors
description: recoverdm recover disks with bad sectors. You can recover files as well complete devices.
  In case it finds sectors which simply cannot be recovered, it writes an empty sector to the output file
  and continues. When recovering a CD or a DVD and the program cannot read the sector in "normal mode",
  then the program will try to read the sector in "RAW mode" (without error-checking etc.). This toolkit
  also has a utility called 'mergebad' which merges multiple images into one. This package is useful in
  forensics investigations.
categories:
- forensics
homepage: https://www.vanheusden.com/recoverdm
size: 65536
install:
- provider: apt
  package: recoverdm
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 0.20-9
