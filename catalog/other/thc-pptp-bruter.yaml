id: thc-pptp-bruter
summary: THC PPTP Brute Force
description: Brute force program against pptp vpn endpoints (tcp port 1723).  Fully standalone. Supports
  latest MSChapV2 authentication. Tested against Windows and Cisco gateways.  Exploits a weakness in Microsoft's
  anti-brute force implementation which makes it possible to try 300 passwords the second.
categories:
- password
binaries:
- thc-pptp-bruter
homepage: http://www.thc.org/releases.php
size: 48128
install:
- provider: apt
  package: thc-pptp-bruter
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 0.1.4-1kali5
