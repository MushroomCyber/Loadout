id: rekono-kbx
summary: automation platform for pentesting
description: Rekono is an automation platform that combines different hacking tools to complete pentesting
  processes. Rekono combines other hacking tools and its results to execute complete pentesting processes
  against a target in an automated way. The findings obtained during the executions will be sent to the
  user via email or Telegram notifications and also can be imported in Defect-Dojo if an advanced vulnerability
  management is needed. Moreover, Rekono includes a Telegram bot that can be used to perform executions
  easily from anywhere and using any device.
categories:
- other
binaries:
- rekono
homepage: https://github.com/pablosnt/rekono
size: 136192
install:
