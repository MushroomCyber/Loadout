id: sshuttle
summary: Transparent proxy server for VPN over SSH
description: Sshuttle makes it possible to access remote networks using SSH. It creates a transparent
  proxy server, using iptables, that will forward all the traffic through an SSH tunnel to a remote copy
  of sshuttle. It does not require installation on the remote server, which just needs to have Python
  installed.
categories:
- network
homepage: https://github.com/sshuttle/sshuttle
size: 881664
install:
- provider: apt
  package: sshuttle
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 1.3.2-1
