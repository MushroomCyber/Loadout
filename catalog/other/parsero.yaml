id: parsero
summary: Robots.txt audit tool
description: 'Parsero is a free script written in Python which reads the Robots.txt file of a web server
  and looks at the Disallow entries. The Disallow entries tell the search engines what directories or
  files hosted on a web server mustn''t be indexed. For example, "Disallow: /portal/login" means that
  the content on www.example.com/portal/login it''s not allowed to be indexed by crawlers like Google,
  Bing, Yahoo... This is the way the administrator have to not share sensitive or private information
  with the search engines.'
categories:
- other
binaries:
- parsero
homepage: https://github.com/behindthefirewalls/Parsero
size: 20480
install:
- provider: apt
  package: parsero
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 0.81~git20140929-0kali2
