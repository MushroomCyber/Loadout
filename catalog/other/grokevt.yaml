id: grokevt
summary: scripts for reading Microsoft Windows event log files
description: GrokEVT is a collection of scripts built for reading Microsoft Windows NT/2000/XP/2003 event
  log files. Currently the scripts work together on one or more mounted Microsoft Windows partitions to
  extract all information needed (registry entries, message templates, and log files) to convert the logs
  to a human-readable format. This program is useful in forensics investigations.
categories:
- forensics
homepage: http://projects.sentinelchicken.org/grokevt/
size: 124928
install:
- provider: apt
  package: grokevt
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 0.5.0-6.1
