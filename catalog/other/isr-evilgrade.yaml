id: isr-evilgrade
summary: Evilgrade framework
description: Evilgrade is a modular framework that allows the user to take advantage of poor upgrade implementations
  by injecting fake updates. It comes with pre-made binaries (agents), a working default configuration
  for fast pentests, and has it's own WebServer and DNSServer modules. Easy to set up new settings, and
  has an autoconfiguration when new binary agents are set.
categories:
- sniffing
