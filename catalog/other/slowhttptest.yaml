id: slowhttptest
summary: application layer Denial of Service attacks simulation tool
description: SlowHTTPTest is a highly configurable tool that simulates some application layer Denial of
  Service attacks. It implements most common low-bandwidth application layer Denial of Service attacks,
  such as * Slowloris * Slow HTTP POST * Slow Read attack (based on TCP persist timer exploit) by draining
  concurrent connections pool * Apache Range Header attack by causing very significant memory and CPU
  usage on the server.
categories:
- vuln-scan
homepage: https://github.com/shekyan/slowhttptest
size: 91136
install:
- provider: apt
  package: slowhttptest
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 1.9.0-1+b1
