id: subversion
summary: Advanced version control system
description: Apache Subversion, also known as svn, is a centralised version control system.  Version control
  systems allow many individuals (who may be distributed geographically) to collaborate on a set of files
  (source code, websites, etc).  Subversion began with a CVS paradigm and supports all the major features
  of CVS, but has evolved to support many features that CVS users often wish they had. This package includes
  the Subversion client (svn, svnsync), repository administration tools (svnadmin, svnlook) and a network
  server (svnserve).
categories:
- utility
homepage: http://subversion.apache.org/
size: 4965376
install:
- provider: apt
  package: subversion
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 1.14.5-6
