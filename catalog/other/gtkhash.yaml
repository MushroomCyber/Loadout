id: gtkhash
summary: GTK+ utility for computing checksums and more
description: GtkHash is a small GTK+ utility which allows users to compute message digests or checksums
  using the mhash library. Currently supported hash functions include MD5, MD6, SHA1, SHA256, SHA512,
  RIPEMD, TIGER and WHIRLPOOL.
categories:
- vuln-scan
binaries:
- gtkhash
homepage: https://gtkhash.org
size: 508928
install:
- provider: apt
  package: gtkhash
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 1.5-3
