id: gr-osmosdr
summary: GNU Radio blocks from the OsmoSDR project
description: 'The Osmocom project is a family of projects regarding Open source mobile communications.
  While primarily being developed for the OsmoSDR hardware, this block as well supports: - FUNcube Dongle
  through gr-funcube - FUNcube Dongle Pro+ through gr-funcube - RTL2832U based DVB-T dongles through librtlsdr
  - RTL-TCP spectrum server (see librtlsdr project) - gnuradio .cfile input through libgnuradio-blocks
  - RFSPACE SDR-IQ, SDR-IP, NetSDR (incl. X2 option) - Great Scott Gadgets HackRF through libhackrf -
  Nuand LLC bladeRF through libbladeRF library - Ettus USRP Devices through Ettus UHD library - Fairwaves
  UmTRX through Fairwaves'' fork of UHD - AIRSPY Receiver - AIRSPY HF+ Receiver - SoapySDR support - Red
  Pitaya SDR transceiver (http://bazaar.redpitaya.com) - FreeSRP through libfreesrp Example applications
  include osmocom_fft, osmocom_siggen, and osmocom_spectrum_sense. By using the OsmoSDR block you can
  take advantage of a common software API in your application(s) independent of the underl'
categories:
- wireless
homepage: https://osmocom.org/projects/gr-osmosdr/wiki
size: 788480
install:
- provider: apt
  package: gr-osmosdr
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 0.2.6-6+b1
