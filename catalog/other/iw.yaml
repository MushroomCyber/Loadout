id: iw
summary: tool for configuring Linux wireless devices
description: This package contains the 'iw' command line tool which allows one to configure and show information
  about wireless devices. iw is based on the nl80211 kernel interface and supports the majority of fairly
  recent hardware. The old tool iwconfig, which uses Wireless Extensions interface, is deprecated and
  it is strongly recommended to switch to iw and nl80211.
categories:
- wireless
binaries:
- iw
homepage: https://wireless.wiki.kernel.org/en/users/documentation/iw
size: 339968
install:
- provider: apt
  package: iw
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 6.17-1
