id: phishery
summary: Basic Auth Credential Harvester with Word Doc Template Injector
description: This package contains a Simple SSL Enabled HTTP server with the primary purpose of phishing
  credentials via Basic Authentication. The power of phishery is best demonstrated by setting a Word document's
  template to a phishery URL. This causes Microsoft Word to make a request to the URL, resulting in an
  Authentication Dialog being shown to the end-user. The ability to inject any .docx file with a URL is
  possible using phishery's -i [in docx], -o [out docx], and -u [url] options.
categories:
- other
homepage: https://github.com/ryhanson/phishery
size: 5302272
install:
- provider: apt
  package: phishery
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 1.0.2-0kali2
