id: crowbar
summary: Brute forcing tool
description: 'This package contains Crowbar (formally known as Levye). It is a brute forcing tool that
  can be used during penetration tests. It was developed to brute force some protocols in a different
  manner according to other popular brute forcing tools. As an example, while most brute forcing tools
  use username and password for SSH brute force, Crowbar uses SSH key(s). This allows for any private
  keys that have been obtained during penetration tests, to be used to attack other SSH servers. Currently
  Crowbar supports: * OpenVPN (-b openvpn) * Remote Desktop Protocol (RDP) with NLA support (-b rdp) *
  SSH private key authentication (-b sshkey) * VNC key authentication (-b vpn)'
categories:
- other
homepage: https://github.com/galkan/crowbar
size: 460800
install:
- provider: apt
  package: crowbar
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 4.2-0kali3
