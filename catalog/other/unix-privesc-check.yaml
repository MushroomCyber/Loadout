id: unix-privesc-check
summary: Script to check for simple privilege escalation vectors
description: Unix-privesc-checker is a script that runs on Unix systems (tested on Solaris 9, HPUX 11,
  Various Linuxes, FreeBSD 6.2). It tries to find misconfigurations that could allow local unprivileged
  users to escalate privileges to other users or to access local apps (e.g. databases). It is written
  as a single shell script so it can be easily uploaded and run (as opposed to un-tarred, compiled and
  installed). It can run either as a normal user or as root (obviously it does a better job when running
  as root because it can read more files).
categories:
- vuln-scan
binaries:
- unix-privesc-check
homepage: http://pentestmonkey.net/tools/audit/unix-privesc-check
size: 87040
install:
- provider: apt
  package: unix-privesc-check
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 1.4-0kali1
