id: t50
summary: Multi-protocol packet injector tool
description: 'Multi-protocol packet injector tool for *nix systems, actually supporting 15 protocols.
  Features: - Flooding - CIDR support - TCP, UDP, ICMP, IGMPv2, IGMPv3, EGP, DCCP, RSVP, RIPv1, RIPv2,
  GRE, ESP, AH, EIGRP and OSPF support. - TCP Options. - High performance. - Can hit about 1.000.000 packets
  per second.'
categories:
- vuln-scan
homepage: https://gitlab.com/fredericopissarra/t50
size: 117760
install:
- provider: apt
  package: t50
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 5.8.7c-2
