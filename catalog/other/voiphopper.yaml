id: voiphopper
summary: Runs a VLAN hop security test
description: VoIP Hopper is a GPLv3 licensed security tool, written in C that rapidly runs a VLAN Hop
  security test.  VoIP Hopper is a VoIP infrastructure security testing tool but also a tool that can
  be used to test the (in)security of VLANs.
categories:
- vuln-scan
