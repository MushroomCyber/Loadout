id: sipcrack
summary: SIP login dumper/cracker
description: The tools contained in this package offer support for pcap files, wordlists and many more
  to extract all needed information and bruteforce the passwords for the sniffed accounts. * sipdump    -  Dump
  SIP digest authentications to a file. * sipcrack   -  Bruteforce the user password using the dump file
  generated by sipdump.
categories:
- password
homepage: http://www.remote-exploit.org/codes_sipcrack.html
size: 73728
