id: whois
summary: intelligent WHOIS client
description: This package provides a commandline client for the WHOIS (RFC 3912) protocol, which queries
  online servers for information such as contact details for domains and IP address assignments. It can
  intelligently select the appropriate WHOIS server for most queries. The package also contains mkpasswd,
  a features-rich front end to the password encryption function crypt(3).
categories:
- network
binaries:
- whois
- mkpasswd
verify: whois --version
size: 393216
install:
- provider: apt
  package: whois
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 5.6.6
