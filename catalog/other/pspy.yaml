id: pspy
summary: Monitor Linux processes without root permissions
description: pspy is a command line tool designed to snoop on processes without need for root permissions.
  It allows you to see commands run by other users, cron jobs, etc. as they execute. Great for enumeration
  of Linux systems in CTFs. Also great to demonstrate your colleagues why passing secrets as arguments
  on the command line is a bad idea.
