id: stegosuite
summary: steganography tool to hide information in image files
description: Stegosuite is a graphical steganography tool to easily hide information in image files. It
  allows the embedding of text messages and multiple files of any type. In addition, the embedded data
  is encrypted using AES. Currently supported file types are BMP, GIF, JPG and PNG. Stegosuite is written
  in Java and utilizes the SWT toolkit for its interface.
categories:
- crypto
homepage: https://codeberg.org/tob/stegosuite
size: 285696
