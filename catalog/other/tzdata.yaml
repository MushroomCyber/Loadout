id: tzdata
summary: time zone and daylight-saving time data
description: This package contains data required for the implementation of standard local time for many
  representative locations around the globe. It is updated periodically to reflect changes made by political
  bodies to time zone boundaries, UTC offsets, and daylight-saving rules.
categories:
- recon
homepage: https://www.iana.org/time-zones
size: 1388544
install:
- provider: apt
  package: tzdata
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 2026b-1
