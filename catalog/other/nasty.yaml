id: nasty
summary: tool which helps you to recover your GPG passphrase
description: 'Nasty is a program that helps you to recover the passphrase of your PGP or GPG-key in case
  you forget or lost it. The following features will make things easier: - set minimum/maximum length
  of the passphrase - incremental mode, random mode or reads a file for guessing - charset filter This
  package is useful in forensics investigations.'
categories:
- forensics
