id: s3scanner
summary: tool to find open S3 buckets and dump their contents
description: 'This package contains a tool to find open S3 buckets and dump their contents. The features
  are: * zap Multi-threaded scanning * telescope Supports tons of S3-compatible APIs * female_detective
  Scans all bucket permissions to find misconfigurations * floppy_disk Dump bucket contents to a local
  folder * whale Docker support'
