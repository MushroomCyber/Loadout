id: dnstracer
summary: trace DNS queries to the source
description: dnstracer determines where a given Domain Name Server (DNS) gets its information from for
  a given hostname, and follows the chain of DNS servers back to the authoritative answer.
categories:
- recon
homepage: http://www.mavetju.org/unix/dnstracer.php
size: 60416
install:
- provider: apt
  package: dnstracer
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 1.9-8
