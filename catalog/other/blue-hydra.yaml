id: blue-hydra
summary: Bluetooth device discovery service
description: BlueHydra is a Bluetooth device discovery service built on top of the bluez library. BlueHydra
  makes use of ubertooth where available and attempts to track both classic and low energy (LE) bluetooth
  devices over time.
