id: webscarab
summary: Web application review tool
description: 'WebScarab is designed to be a tool for anyone who needs to expose the workings of an HTTP(S)
  based application, whether to allow the developer to debug otherwise difficult problems, or to allow
  a security specialist to identify vulnerabilities in the way that the application has been designed
  or implemented.


  No longer maintained: Archived by OWASP in 2021. OWASP ZAP is the project''s own successor and covers
  the same intercepting-proxy ground.'
