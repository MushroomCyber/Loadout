id: vopono
summary: Run applications through VPN tunnels with temporary network namespaces
description: vopono is a tool to run applications through VPN tunnels via temporary network namespaces.
  This allows you to run only a handful of applications through different VPNs simultaneously, whilst
  keeping your main connection as normal.
categories:
- other
