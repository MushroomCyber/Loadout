id: traceroute
summary: Traces the route taken by packets over an IPv4/IPv6 network
description: The traceroute utility displays the route used by IP packets on their way to a specified
  network (or Internet) host. Traceroute displays the IP number and host name (if possible) of the machines
  along the route taken by the packets. Traceroute is used as a network debugging tool. If you're having
  network connectivity problems, traceroute will show you where the trouble is coming from along the route.
  Install traceroute if you need a tool for diagnosing network connectivity problems.
categories:
- vuln-scan
homepage: https://traceroute.sourceforge.net/
size: 163840
install:
- provider: apt
  package: traceroute
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 1:2.1.6-1
