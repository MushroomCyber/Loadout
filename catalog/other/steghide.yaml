id: steghide
summary: steganography hiding tool
description: Steghide is steganography program which hides bits of a data file in some of the least significant
  bits of another file in such a way that the existence of the data file is not visible and cannot be
  proven. Steghide is designed to be portable and configurable and features hiding data in bmp, jpeg,
  wav and au files, blowfish encryption, MD5 hashing of passphrases to blowfish keys, and pseudo-random
  distribution of hidden bits in the container data. Steghide is useful in digital forensics investigations.
categories:
- crypto
binaries:
- steghide
homepage: http://steghide.sourceforge.net/
size: 488448
install:
- provider: apt
  package: steghide
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 0.5.1-15
