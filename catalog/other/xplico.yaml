id: xplico
summary: Network Forensic Analysis Tool (NFAT)
description: The goal of Xplico is extract from an internet traffic capture the applications data contained.
  For example, from a pcap file Xplico extracts each email (POP, IMAP, and SMTP protocols), all HTTP contents,
  each VoIP call (SIP, MGCP, H323), FTP, TFTP, and so on. Xplico is not a network protocol analyzer.
categories:
- forensics
homepage: https://www.xplico.org
size: 10569728
install:
- provider: apt
  package: xplico
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 1.2.2-0kali7
