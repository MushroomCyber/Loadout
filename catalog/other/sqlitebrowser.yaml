id: sqlitebrowser
summary: GUI editor for SQLite databases
description: 'SQLite Database Browser is a visual tool used to create, design and edit database files
  compatible with SQLite. Its interface is based on QT, and is meant to be used for users and developers
  that want to create databases, edit and search data using a familiar spreadsheet-like interface, without
  the need to learn complicated SQL commands. Controls and wizards are available for users to: - Create
  and compact database files - Create, define, modify and delete tables - Create, define and delete indexes
  - Browse, edit, add and delete records - Search records - Import and export records as text - Import
  and export tables from/to CSV files - Import and export databases from/to SQL dump files - Issue SQL
  queries and inspect the results - Examine a log of all SQL commands issued by the application SQLite
  Database Browser is not a visual shell for the sqlite command line tool. It does not require familiarity
  with SQL commands.'
categories:
- web
binaries:
- sqlitebrowser
homepage: https://sqlitebrowser.org/
size: 5829632
install:
- provider: apt
  package: sqlitebrowser
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 3.13.1-1
