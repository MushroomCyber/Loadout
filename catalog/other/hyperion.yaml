id: hyperion
summary: Runtime encrypter for 32-bit portable executables
description: 'This package contains a runtime encrypter for 32-bit portable executables. It is a reference
  implementation and bases on the paper "Hyperion: Implementation of a PE-Crypter". The paper describes
  the implementation details which aren''t in the scope of this readme file. The crypter is started via
  the command line and encrypts an input executable with AES-128. The encrypted file decrypts itself on
  startup (bruteforcing the AES key which may take a few seconds) and generates a log file for debug purpose.'
categories:
- post-exploitation
tags:
- windows
homepage: http://www.nullsecurity.net/tools/binary.html
size: 1236992
install:
- provider: apt
  package: hyperion
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 2.0-0kali4
