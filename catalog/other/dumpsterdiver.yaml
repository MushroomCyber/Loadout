id: dumpsterdiver
summary: tool to analyze big volumes of data in search of hardcoded secrets
description: This package contains a tool, which can analyze big volumes of data in search of hardcoded
  secrets like keys (e.g. AWS Access Key, Azure Share Key or SSH keys) or passwords. Additionally, it
  allows creating a simple search rules with basic conditions (e.g. report only csv files including at
  least 10 email addresses). The main idea of this tool is to detect any potential secret leaks.
categories:
- other
