id: routerkeygenpc
summary: Router Keygen generate default WPA/WEP keys
description: 'This package generates default WPA/WEP keys for the several routers: * Thomson based routers
  ( this includes Thomson, SpeedTouch, Orange, Infinitum, BBox, DMax, BigPond, O2Wireless, Otenet, Cyta
  , TN_private, Blink ) * DLink ( only some models ) * Pirelli Discus * Eircom * Verizon FiOS ( only some
  routers supported) * Alice AGPF * FASTWEB Pirelli and Telsey * Huawei (some InfinitumXXXX) * Wlan_XXXX
  or Jazztel_XXXX * Wlan_XX ( only some are supported) * Ono ( P1XXXXXX0000X ) * WlanXXXXXX, YacomXXXXXX
  and WifiXXXXXX * Sky V1 routers * Clubinternet.box v1 and v2 ( TECOM-AH4XXXX ) * InfostradaWifi * CONN-X
  * Megared * EasyBox, Arcor and Vodafone * PBS (Austria) * MAXCOM * PTV * TeleTu/Tele2 * Axtel, Axtel-xtremo
  * Intercable * OTE * Cabovisao Sagem * Alice in Germany * Speedport'
categories:
- other
homepage: https://github.com/routerkeygen/routerkeygenPC
size: 5954560
install:
- provider: apt
