id: massdns
summary: high-performance DNS stub resolver
description: This package contains a simple high-performance DNS stub resolver targeting those who seek
  to resolve a massive amount of domain names in the order of millions or even billions. Without special
  configuration, MassDNS is capable of resolving over 350,000 names per second using publicly available
  resolvers.
categories:
- other
binaries:
- massdns
homepage: https://github.com/blechschmidt/massdns
size: 131072
install:
- provider: apt
  package: massdns
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 1.1.0-0kali2
