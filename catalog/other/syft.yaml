id: syft
summary: CLI tool for generating a SBOM from container images and filesystems
description: This package contains a CLI tool and Go library for generating a Software Bill of Materials
  (SBOM) from container images and filesystems. Exceptional for vulnerability detection when used with
  a scanner like Grype. * Generates SBOMs for container images, filesystems, archives, and more to discover
  packages and libraries * Supports OCI, Docker and Singularity image formats * Linux distribution identification
  * Works seamlessly with Grype (a fast, modern vulnerability scanner) * Able to create signed SBOM attestations
  using the in-toto specification * Convert between SBOM formats, such as CycloneDX, SPDX, and Syft's
  own format.
categories:
- other
binaries:
- syft
homepage: https://github.com/anchore/syft
size: 83992576
install:
- provider: github
  repo: anchore/syft
  checksums: "*_checksums.txt"
  priority: 40
  # Keyless Sigstore, verified against a pinned workflow identity rather than
  # a key. The identity was read out of the real certificate rather than
  # copied from documentation, and confirmed to verify releases 1.50.0 and
  # 1.51.1 -- it is `refs/heads/main`, not a tag, so it does not move with
  # each release and a literal pin holds.
  signature:
    type: cosign
    asset: "*_checksums.txt.sig"
    certificate: "*_checksums.txt.pem"
    signs: checksums
    certificate_identity: https://github.com/anchore/syft/.github/workflows/release.yaml@refs/heads/main
    certificate_oidc_issuer: https://token.actions.githubusercontent.com
- provider: apt
  package: syft
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 1.44.0+ds-0kali1
