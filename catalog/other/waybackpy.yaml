id: waybackpy
summary: Access Wayback Machine's API using Python
description: waybackpy is a Python package and a CLI tool that interfaces with the Wayback Machine's APIs.
  Internet Archive's Wayback Machine has 3 useful public APIs. SavePageNow API (also known as Save API)
  CDX Server API Availability API These three APIs can be accessed via the waybackpy either by importing
  it from a Python file/module or from the command-line interface.
categories:
