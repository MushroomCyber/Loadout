id: memdump
summary: utility to dump memory contents to standard output
description: Program which dumps system memory to the standard output stream, skipping over holes in memory
  maps. By default, the program dumps the contents of physical memory. This program will not work if CONFIG_STRICT_DEVMEM
  is enabled in kernel. Since 2.6 version, several kernels are enabling this option by default. memdump
  is useful in security tests and forensics investigations.
categories:
- forensics
binaries:
- memdump
homepage: http://www.porcupine.org/forensics/tct.html
size: 45056
install:
- provider: apt
  package: memdump
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 1.01-9
