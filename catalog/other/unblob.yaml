id: unblob
summary: accurate, fast, and easy-to-use extraction suite (Python 3)
description: This package contains an accurate, fast, and easy-to-use extraction suite. It parses unknown
  binary blobs for more than 30 different archive, compression, and file-system formats, extracts their
  content recursively, and carves out unknown chunks that have not been accounted for. This package installs
  the library for Python 3.
