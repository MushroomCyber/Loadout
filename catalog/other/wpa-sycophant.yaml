id: wpa-sycophant
summary: tool to relay phase 2 authentication attempts to access corporate wireless
description: This package contains a tool to relay phase 2 authentication attempts to access corporate
  wireless without cracking the password. To use this technique it is required that you run a rogue access
  point so that a legitimate user will connect to you so that you may relay the authentication attempt
  to Sycophant.
