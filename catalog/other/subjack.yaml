id: subjack
summary: Subdomain Takeover tool
description: This package contains a Subdomain Takeover tool written in Go designed to scan a list of
  subdomains concurrently and identify ones that are able to be hijacked. With Go's speed and efficiency,
  this tool really stands out when it comes to mass-testing. Always double check the results manually
  to rule out false positives. Subjack will also check for subdomains attached to domains that don't exist
  (NXDOMAIN) and are available to be registered.
categories:
- other
homepage: https://github.com/haccer/subjack
size: 11258880
install:
- provider: apt
  package: subjack
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 2.1-0kali2
