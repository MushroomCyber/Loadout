id: sliver
summary: Implant framework
description: This package contains a general purpose cross-platform implant framework that supports C2
  over Mutual-TLS, HTTP(S), and DNS. Implants are dynamically compiled with unique X.509 certificates
  signed by a per-instance certificate authority generated when you first run the binary.
