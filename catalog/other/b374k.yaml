id: b374k
summary: Remote management tool
description: 'This package contains PHP Shell is a useful tool for system or web administrator to do remote
  management without using cpanel, connecting using ssh, ftp etc. All actions take place within a web
  browser Features: * File manager (view, edit, rename, delete, upload, download, archiver, etc) * Search
  file, file content, folder (also using regex) * Command execution * Script execution (php, perl, Python,
  ruby, java, node.js, c) * Give you shell via bind/reverse shell connect * Simple packet crafter * Connect
  to DBMS (MySQL, mssql, oracle, sqlite, PostgreSQL, and many more using ODBC or PDO) * SQL Explorer *
  Process list/Task manager * Send mail with attachment (you can attach local file on server) * String
  conversion * All of that only in 1 file, no installation needed'
categories:
- other
tags:
- web-shell
homepage: https://github.com/b374k/b374k
size: 505856
