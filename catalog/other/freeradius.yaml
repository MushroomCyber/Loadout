id: freeradius
summary: high-performance and highly configurable RADIUS server
description: 'FreeRADIUS is a high-performance RADIUS server with support for: - Authentication by local
  files, SQL, Kerberos, LDAP, PAM, and more. - Powerful policy configuration language. - Proxying and
  replicating requests by any criteria. - Support for many EAP types; TLS, PEAP, TTLS, etc. - Many vendor-specific
  attributes. - Regexp matching in string attributes. and lots more.'
categories:
- network
binaries:
- freeradius
- checkrad
- rad_counter
- raddebug
- radmin
- rlm_sqlippool_tool
homepage: http://www.freeradius.org/
size: 3516416
install:
- provider: apt
  package: freeradius
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 3.2.8+dfsg-1
