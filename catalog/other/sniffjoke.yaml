id: sniffjoke
summary: Transparent TCP connection scrambler
description: SniffJoke is an application for Linux that handle transparently your TCP connection, delaying,
  modifyng and inject fake packets inside your transmission, make them almost impossible to be correctly
  readed by a passive wiretapping technology (IDS or sniffer).
categories:
- sniffing
binaries:
- sniffjoke
- sj-commit-results
- sj-iptcpopt-probe
- sniffjoke-autotest
- sniffjokectl
homepage: https://github.com/vecna/sniffjoke
size: 530432
install:
- provider: apt
  package: sniffjoke
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 0.4.1-1kali2
