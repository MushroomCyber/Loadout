id: windows-privesc-check
summary: Windows privilege escalation checking tool
description: Windows-privesc-check is standalone executable that runs on Windows systems (tested on XP,
  Windows 7 only so far). It tries to find misconfigurations that could allow local unprivileged users
  to escalate privileges to other users or to access local apps (e.g. databases). It is written in python
  and converted to an executable using pyinstaller so it can be easily uploaded and run (as opposed to
  unzipping python + other dependencies). It can run either as a normal user or as Administrator (obviously
  it does a better job when running as Administrator because it can read more files).
categories:
