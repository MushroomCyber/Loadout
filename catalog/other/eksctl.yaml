id: eksctl
summary: official CLI for Amazon EKS (program)
description: eksctl is a simple CLI tool for creating clusters on EKS - Amazon's new managed Kubernetes
  service for EC2. It is written in Go, and uses CloudFormation. You can create a cluster in minutes with
  just one command – **eksctl create cluster**!
