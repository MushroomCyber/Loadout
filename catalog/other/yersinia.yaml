id: yersinia
summary: Network vulnerabilities check software
description: 'Yersinia is a framework for performing layer 2 attacks. It is designed to take advantage
  of some weakeness in different network protocols. It pretends to be a solid framework for analyzing
  and testing the deployed networks and systems. Attacks for the following network protocols are implemented
  in this particular release: - Spanning Tree Protocol (STP). - Cisco Discovery Protocol (CDP). - Dynamic
  Trunking Protocol (DTP). - Dynamic Host Configuration Protocol (DHCP). - Hot Standby Router Protocol
  (HSRP). - 802.1q. - 802.1x. - Inter-Switch Link Protocol (ISL). - VLAN Trunking Protocol (VTP).'
categories:
- vuln-scan
homepage: https://github.com/tomac/yersinia
size: 427008
install:
- provider: apt
  package: yersinia
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 0.8.2-2.3
