id: faraday
summary: Collaborative Penetration Test IDE
description: Faraday introduces a new concept (IPE) Integrated Penetration-Test Environment a multiuser
  Penetration test IDE. Designed for distribution, indexation and analysis of the generated data during
  the process of a security audit. The main purpose of Faraday is to re-use the available tools in the
  community to take advantage of them in a multiuser way. This package no longer contains the GTK client
  like the upstream repo.
categories:
- reporting
homepage: https://faradaysec.com
size: 42250240
install:
- provider: apt
  package: faraday
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 5.21.0-0kali1
