id: dns2tcp
summary: TCP-over-DNS tunnel server and client
description: dns2tcp is a set of tools to encapsulate a TCP session in DNS packets. This type of encapsulation
  generates smaller packets than IP-over-DNS, improving throughput. The client does not need root privileges.1
