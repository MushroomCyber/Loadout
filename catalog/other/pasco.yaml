id: pasco
summary: Internet Explorer cache forensic analysis tool
description: Pasco is a forensic tool that examines the content of cache files (index.dat) produced by
  Microsoft Internet Explorer. It parses the file and outputs a field separated that can be loaded in
  a spreadsheet. This package is useful in forensics investigations.
