id: samba
summary: SMB/CIFS file, print, and login server for Unix
description: Samba is an implementation of the SMB/CIFS protocol for Unix systems, providing support for
  cross-platform file and printer sharing with Microsoft Windows, OS X, and other Unix systems.  Samba
  can also function as an Active Directory or NT4-style domain controller, and can integrate with Active
  Directory realms or NT4 domains as a member server. This package provides the components necessary to
  use Samba as a stand-alone file and print server or as an NT4 domain controller.  For use in an NT4
  domain or Active Directory realm, you will also need the winbind package. To use samba as an Active
  Directory domain controller (AD DC), please install samba-ad-dc package. This package is not required
  for connecting to existing SMB/CIFS servers (see smbclient) or for mounting remote filesystems (see
  cifs-utils).
categories:
