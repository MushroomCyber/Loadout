id: ridenum
summary: Null session RID cycle attack tool
description: Rid Enum is a RID cycling attack that attempts to enumerate user accounts through null sessions
  and the SID to RID enum. If you specify a password file, it will automatically attempt to brute force
  the user accounts when its finished enumerating.
