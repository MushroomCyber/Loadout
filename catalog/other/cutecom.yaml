id: cutecom
summary: Graphical serial terminal, like minicom
description: Cutecom is a graphical serial terminal, like minicom. It is aimed mainly at hardware developers
  or other people who need a terminal to talk to their devices. It features lineoriented interface instead
  of character-oriented, xmodem, ymodem, zmodem support (requires the lrzsz package) and hexadecimal input
  and output among other things. It is written using the Qt library originally by Trolltech (www.trolltech.com).
categories:
- hardware
binaries:
- cutecom
homepage: https://gitlab.com/cutecom/cutecom
size: 756736
install:
- provider: apt
  package: cutecom
  distros:
