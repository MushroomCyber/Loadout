id: bruteshark
summary: Network Forensic Analysis Tool (NFAT)
description: 'This package contains a Network Forensic Analysis Tool (NFAT) that performs deep processing
  and inspection of network traffic (mainly PCAP files, but it also capable of directly live capturing
  from a network interface). It includes: password extracting, building a network map, reconstruct TCP
  sessions, extract hashes of encrypted passwords and even convert them to a Hashcat format in order to
  perform an offline Brute Force attack. The main goal of the project is to provide solution to security
  researchers and network administrators with the task of network traffic analysis while they try to identify
  weaknesses that can be used by a potential attacker to gain access to critical points on the network.
  On Linux it is a Command Line Interface tool.'
categories:
- other
binaries:
- brutesharkcli
homepage: https://github.com/odedshimon/BruteShark
size: 97823744
install:
- provider: apt
  package: bruteshark
  distros:
  - kali
  - debian
  - parrot
  - ubuntu
version: 1.2.5-0kali8
