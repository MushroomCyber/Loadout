id: ropper
summary: rop gadget finder and binary information tool
description: This package contains scripts that display info about files in different formats and find
  gadgets to build ROPs chains for different architectures (x86/x86_64, ARM/ARM64, MIPS, PowerPC). For
  disassembly ropper uses the Capstone Framework.
