id: multitor
summary: Run several independent Tor instances behind a load-balancing HAProxy
description: 'Spins up multiple isolated Tor processes and load-balances across them through HAProxy,
  which spreads requests across more exit circuits than a single Tor instance would -- useful where one
  circuit''s rate limit is the bottleneck.


  No packaged install: clone the repository and run `./multitor` as root, which needs `tor`, `haproxy`
  and `privoxy` already installed.'
categories:
- network
tags:
