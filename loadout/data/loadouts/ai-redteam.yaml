slug: ai-redteam
name: AI Red Team
description: Testing LLM applications, agents, and the model files themselves
tags:
- ai-security
- red-team
# Only tools that install *and run*. The libraries in this category
# (adversarial-robustness-toolbox, giskard, llm-guard, rebuff) declare no
# console script, so pipx refuses them; modelscan pins python_requires <3.13
# and counterfit dies importing distutils on 3.12+, so neither works on a
# current Kali. picklescan covers modelscan's ground here.
tools:
- agentic-security
- fickling
- garak
- picklescan
- promptfoo
- pyrit
- textattack
