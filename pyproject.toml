[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "loadout"
version = "1.0.0.dev0"
description = "Pick your kit, install it anywhere, prove what you used — a security tool manager for any distro."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MushroomCyber" }]
requires-python = ">=3.10"
keywords = [
  "security", "pentest", "dfir", "blue-team", "package-manager",
  "kali", "parrot", "tools", "cli", "tui",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Software Distribution",
  "Typing :: Typed",
]

# Deliberately small. The catalog is data, not code, and nothing here needs a
# compiler -- the previous release's notify2 dependency pulled in dbus-python,
# which needs system headers and frequently failed to build.
dependencies = [
  "rich>=13.7",
  "requests>=2.31",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
tui = ["textual>=0.60"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "textual>=0.60",
  "types-requests",
  "types-PyYAML",
]

[project.scripts]
loadout = "loadout.ui.cli:cli"
# Deprecated alias, removed in 2.0. Prints a notice to stderr, then forwards.
kalitools = "loadout.ui.cli:legacy_shim"

[project.urls]
Homepage = "https://github.com/MushroomCyber/Loadout"
Repository = "https://github.com/MushroomCyber/Loadout"
Issues = "https://github.com/MushroomCyber/Loadout/issues"
Changelog = "https://github.com/MushroomCyber/Loadout/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["loadout*"]

[tool.setuptools.package-data]
loadout = ["data/catalog.db", "data/loadouts/*.yaml", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # import sorting
  "B",                # bugbear
  "UP",               # pyupgrade
  "S",                # bandit — this is a security tool, so lint like one
  "RUF",
  "SIM",
  "C4",
  "PTH",
]
ignore = [
  "E501",    # long lines are handled by the formatter
  "S101",    # assert is fine in tests
  "SIM105",  # contextlib.suppress is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "SLF001", "PTH"]
"tools/*" = ["S", "PTH", "C408"]
# store.py builds `IN (?,?,?)` clauses: the placeholder *count* is interpolated,
# every value is bound. Verified by tests/test_catalog.py::test_fts_operators_*.
"loadout/catalog/store.py" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["loadout"]
omit = ["loadout/ui/tui/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["legacy/", "tools/"]

[[tool.mypy.overrides]]
module = ["textual.*", "apt.*"]
ignore_missing_imports = true
